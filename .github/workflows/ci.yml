# AAVAIL Revenue Forecast | Continuous Integration
#
# Runs automatically on every push. Results are visible to anyone on the
# repository's "Actions" tab:
#   1. unit-tests : installs the requirements and runs ALL unit tests
#   2. docker     : builds the Docker image (which also trains the models and
#                   runs the tests), starts the container and calls the API
#                   for all countries and for a single country.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Run all unit tests with one script
        run: python run-tests.py -v

  docker:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image (ingests data, trains models, runs tests)
        run: docker build -t aavail-revenue-forecast .
      - name: Start the container
        run: |
          docker run -d -p 8080:8080 --name api aavail-revenue-forecast
          for i in $(seq 1 30); do curl -sf http://localhost:8080/ && break; sleep 2; done
      - name: Health check
        run: curl -sf http://localhost:8080/
      - name: Predict for ALL countries
        run: |
          curl -sf -X POST http://localhost:8080/predict -H "Content-Type: application/json" \
               -d '{"query": {"country": "all", "year": "2019", "month": "07", "day": "01"}}'
      - name: Predict for ONE country
        run: |
          curl -sf -X POST http://localhost:8080/predict -H "Content-Type: application/json" \
               -d '{"query": {"country": "united_kingdom", "year": "2019", "month": "07", "day": "01"}}'
      - name: Container logs
        if: always()
        run: docker logs api
